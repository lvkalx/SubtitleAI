name: backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - run: dotnet restore SubtitleAI.sln
      - run: dotnet build SubtitleAI.sln -c Release --no-restore
      - run: dotnet test SubtitleAI.sln -c Release --no-build